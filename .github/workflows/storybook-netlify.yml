name: Upload Storybook to Netlify

on:
  # Privilege escalation is necessary to deploy to Netlify.
  # 🚨 Do not check out or execute source code in this workflow.
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Build Storybook"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

permissions: {}

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    name: Upload Storybook
    runs-on: ubuntu-24.04
    environment: Netlify
    permissions:
      actions: read
      deployments: write
    steps:
      - name: Download Storybook artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: storybook
          path: storybook-static

      - name: Deploy Storybook preview
        uses: matrix-org/netlify-pr-preview@9805cd123fc9a7e421e35340a05e1ebc5dee46b5 # v3
        with:
          path: storybook-static
          owner: ${{ github.event.workflow_run.head_repository.owner.login }}
          branch: ${{ github.event.workflow_run.head_branch }}
          revision: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          site_id: ${{ vars.NETLIFY_SITE_ID }}
          desc: Storybook
          deployment_env: Netlify
          prefix: "storybook-"
