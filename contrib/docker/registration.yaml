namespaces:
  rooms: []
  users: # In the following, foobar is your homeserver's domain
    - regex: "@hookshot:foobar"
      exclusive: true
    - regex: "@_github_.*:foobar"
      exclusive: true
    - regex: "@_gitlab_.*:foobar"
      exclusive: true
